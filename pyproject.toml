[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bytebank-ia-multiagentes"
version = "1.0.0"
description = "Checkpoint de Especialista em IA Nível 2: governança, RAG, avaliação e agentes com HITL."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
rag = [
  "langchain-core>=0.3,<2",
  "langchain-text-splitters>=0.3,<2",
  "langchain-openai>=0.3,<2",
  "langchain-chroma>=0.2,<2",
  "chromadb>=0.6,<2",
]
agents = ["langgraph>=0.3,<2"]
ui = ["gradio>=5,<7"]
full = [
  "langchain-core>=0.3,<2",
  "langchain-text-splitters>=0.3,<2",
  "langchain-openai>=0.3,<2",
  "langchain-chroma>=0.2,<2",
  "chromadb>=0.6,<2",
  "langgraph>=0.3,<2",
  "gradio>=5,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

